data:
  source: us_treasury_daily_par_yield_curve
  start_year: 2006
  end_year: null
  maturities: [2Y, 5Y, 10Y, 30Y]
  request_timeout_seconds: 60
  overwrite_raw: false
  max_change_gap_days: 7

paths:
  raw_dir: data/raw/treasury
  processed_dir: data/processed
  pca_dir: data/processed/pca
  forecast_dir: results/forecast

pca:
  sample_start: 2006-02-10
  train_end: 2019-12-31
  n_components: 4
  retained_components: 3

futures:
  symbols: [ZT, ZF, ZN, ZB]
  start_date: '2000-01-01'
  # Exclusive end; null excludes today's possibly incomplete daily bar.
  end_date: null
  raw_dir: data/raw/futures/yahoo_candidates
  output_dir: data/processed/futures_candidates
  request_timeout_seconds: 60

forecast:
  first_oos_date: 2020-01-01
  horizon_days: 5
  validation_years: 2
  ridge_alphas: [0.1, 1.0, 10.0, 100.0]
  refit_frequency: monthly
  prediction_frequency: daily
